<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Natural User Interface - Hand Tracking with MediaPipe & Three.js">
  <title>NUI Hand Tracking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="https://github.com/Warid27/try-nui" target="_blank" rel="noopener noreferrer" id="github-link" class="github-link" aria-label="View source on GitHub">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    <span>Source</span>
  </a>

  <!-- Main canvas for Three.js WebGL rendering -->
  <canvas id="webgl-canvas" aria-label="3D scene controlled by hand gestures"></canvas>

  <!-- Video element for webcam feed (hidden, used by MediaPipe) -->
  <video id="webcam" playsinline muted aria-label="Camera preview"></video>

  <!-- Canvas overlay for debug visualization (hand landmarks, skeleton) -->
  <canvas id="debug-canvas" aria-label="Hand tracking debug overlay"></canvas>

  <!-- Debug info panel -->
  <div id="debug-panel" class="debug-panel">
    <div class="debug-header">
      <span class="debug-title">DEBUG MODE</span>
      <button id="debug-toggle" class="debug-toggle" aria-label="Toggle debug overlay">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
    <div class="debug-grid">
      <div class="debug-item">
        <span class="debug-label">FPS</span>
        <span id="fps-value" class="debug-value">--</span>
      </div>
      <div class="debug-item">
        <span class="debug-label">Gesture</span>
        <span id="gesture-value" class="debug-value">--</span>
      </div>
      <div class="debug-item">
        <span class="debug-label">Confidence</span>
        <span id="confidence-value" class="debug-value">--</span>
      </div>
      <div class="debug-item">
        <span class="debug-label">Handedness</span>
        <span id="handedness-value" class="debug-value">--</span>
      </div>
      <div class="debug-item">
        <span class="debug-label">Hand Pos</span>
        <span id="handpos-value" class="debug-value">--</span>
      </div>
      <div class="debug-item">
        <span class="debug-label">Target Pos</span>
        <span id="targetpos-value" class="debug-value">--</span>
      </div>
    </div>
  </div>

  <!-- Gesture guide panel -->
  <div id="gesture-guide" class="gesture-guide">
    <h3>GESTURE CONTROLS</h3>
    <ul>
      <li><svg class="gesture-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 13"/></svg> Open Palm → Expand / Attract</li>
      <li><svg class="gesture-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M9 12v2"/><path d="M15 12v2"/><path d="M12 14v4"/><circle cx="12" cy="5" r="1" fill="currentColor"/></svg> Pinch → Freeze / Pulse</li>
      <li><svg class="gesture-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v7"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/><path d="m15 5 4 4"/><path d="m15 9 4-4"/></svg> Pointing Up → Rise</li>
    </ul>
  </div>

  <!-- Loading indicator -->
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Initializing hand tracking...</p>
    <p class="loading-hint">Please allow camera access</p>
  </div>

  <!-- Error display -->
  <div id="error-toast" class="error-toast" aria-live="polite"></div>

  <!-- Main application script -->
  <script type="module" src="main.js"></script>
</body>
</html>
